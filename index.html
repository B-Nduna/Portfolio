    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Restores the real path that 404.html encoded into the query
      // string, before React Router mounts and reads the URL.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
